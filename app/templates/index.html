<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Fontes — to the sources</title>
<meta name="theme-color" content="#14161C">
<meta name="description" content="Study the text. Every claim shows its source.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ad Fontes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/static/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="/static/apple-touch-icon-152.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   Illuminated manuscript, adapted for screens.

   Medieval Bibles were written in dark ink on parchment, with
   headings rubricated in red and initials laid in gold leaf. That
   is where the palette comes from — rubric red and gold are not
   decoration here, they are the two colours scripture has actually
   been marked up in for a thousand years.

   Dark is the default because every other Bible app is white, and
   because people read scripture at night, on a phone, in bed.
   ═══════════════════════════════════════════════════════════════ */

:root, [data-theme="dark"]{
  --ground:#14161C;
  --raised:#1C1F27;
  --raised2:#232733;
  --edge:#2E323E;
  --text:#E8E4DA;
  --text-dim:#B4B2AB;
  --muted:#868A95;
  --rubric:#D96A56;
  --gold:#D4A64A;
  --verdigris:#52A69C;
  --glow:rgba(212,166,74,.09);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.22);
}
[data-theme="light"]{
  --ground:#EFEDE6;
  --raised:#FAF9F5;
  --raised2:#F3F1EA;
  --edge:#DAD7CC;
  --text:#1A1C22;
  --text-dim:#3E424A;
  --muted:#6E7178;
  --rubric:#A5372C;
  --gold:#8A6614;
  --verdigris:#2F6F6A;
  --glow:rgba(138,102,20,.07);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
a{color:var(--rubric)}
::selection{background:var(--gold);color:var(--ground)}

/* ── masthead ─────────────────────────────────────────── */
.masthead{border-bottom:1px solid var(--edge);padding:18px 26px;background:var(--raised)}
.masthead-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:inline-block;width:34px;height:34px;flex:0 0 34px}
.mark svg{width:100%;height:100%;display:block}
@media(max-width:560px){.mark{width:28px;height:28px;flex:0 0 28px}}
.wordmark{
  font-family:"EB Garamond",Georgia,serif;font-size:27px;font-weight:600;
  letter-spacing:.005em;margin:0;line-height:1;
}
.wordmark em{color:var(--gold);font-style:normal}
.tagline{font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.langtoggle,.themetoggle{
  display:flex;border:1px solid var(--edge);border-radius:5px;overflow:hidden;background:var(--raised2);
}
.langtoggle{margin-left:auto}
.langtoggle button,.themetoggle button{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;background:none;color:var(--muted);border:0;
  padding:5px 11px;cursor:pointer;transition:all .15s;
}
.langtoggle button+button{border-left:1px solid var(--edge)}
.langtoggle button[aria-pressed="true"]{background:var(--gold);color:var(--ground);font-weight:500}
.themetoggle button{padding:5px 9px;font-size:13px}
.themetoggle button:hover{color:var(--gold)}
.lenspick select{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  background:var(--raised2);color:var(--muted);border:1px solid var(--edge);
  border-radius:5px;padding:5px 8px;cursor:pointer;max-width:200px;
}
.lenspick select:hover{color:var(--gold);border-color:var(--gold)}
.pos-lens{border-left:3px solid var(--gold)}
.pos-folded{display:none}
.pos-folded.open{display:block}
.pos-more{
  display:block;width:100%;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;background:var(--raised);
  color:var(--verdigris);border:0;border-top:1px solid var(--verdigris);
  padding:10px;cursor:pointer;text-align:left;
}
.pos-more:before{content:"▸ ";}
.pos-more.open:before{content:"▾ ";}
.pos-more:hover{color:var(--gold)}
.status-pill{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  border:1px solid var(--edge);border-radius:5px;padding:4px 9px;background:var(--raised2);
}

/* ── query ────────────────────────────────────────────── */
.query{max-width:1280px;margin:0 auto;padding:22px 26px 0}
.modes{display:flex;gap:4px;margin-bottom:16px}
.modes button{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;background:transparent;border:1px solid transparent;
  border-radius:6px;color:var(--muted);padding:7px 15px;cursor:pointer;transition:all .15s;
}
.modes button:hover{color:var(--text)}
.modes button[aria-selected="true"]{
  background:var(--raised);border-color:var(--edge);color:var(--gold);
}
.query-row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field.ref{flex:0 0 230px}
.field.ask{flex:1 1 360px;min-width:250px}
label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--muted);
}
input[type=text]{
  font-family:"EB Garamond",Georgia,serif;font-size:17px;color:var(--text);
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;
  padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s;
}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{
  outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--glow);
}
button.go{
  font-size:14px;font-weight:500;background:var(--gold);color:var(--ground);
  border:0;border-radius:6px;padding:12px 24px;cursor:pointer;transition:all .15s;
}
button.go:hover{background:var(--rubric);color:var(--text)}
button.go:disabled{background:var(--edge);color:var(--muted);cursor:wait}
.examples{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap}
.examples button{
  font-family:"EB Garamond",Georgia,serif;font-size:14.5px;color:var(--text-dim);
  background:var(--raised);border:1px solid var(--edge);border-radius:20px;
  padding:5px 14px;cursor:pointer;transition:all .15s;
}
.examples button:hover{border-color:var(--gold);color:var(--gold)}

/* ── book picker ──────────────────────────────────────── */
.picker{position:relative}
.picker-btn{
  font-family:"EB Garamond",Georgia,serif;font-size:16.5px;background:var(--raised);
  border:1px solid var(--edge);border-radius:6px;padding:11px 13px;cursor:pointer;
  width:100%;text-align:left;color:var(--text);display:flex;align-items:center;gap:8px;
  transition:border-color .15s;
}
.picker-btn:hover{border-color:var(--gold)}
.picker-btn .caret{margin-left:auto;color:var(--muted);font-size:10px}
.panel{
  position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:min(680px,92vw);
  background:var(--raised);border:1px solid var(--edge);border-radius:9px;
  box-shadow:var(--shadow);padding:15px;display:none;
}
.panel.open{display:block}
.panel h4{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold);margin:0 0 9px;font-weight:500;
}
.panel h4+h4{margin-top:17px}
.booklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:2px}
.booklist button{
  font-family:"EB Garamond",Georgia,serif;font-size:15px;text-align:left;
  background:none;border:0;padding:5px 8px;cursor:pointer;color:var(--text);border-radius:4px;
}
.booklist button:hover{background:var(--gold);color:var(--ground)}
.chaplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;
  max-height:290px;overflow-y:auto}
.chaplist button{
  font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--raised2);
  border:1px solid var(--edge);padding:8px 0;cursor:pointer;color:var(--text);border-radius:4px;
}
.chaplist button:hover{background:var(--gold);color:var(--ground);border-color:var(--gold)}
.wholechap{
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;width:100%;
  background:var(--gold);color:var(--ground);border:0;border-radius:6px;
  padding:9px 0;cursor:pointer;margin-bottom:11px;font-weight:500;
}
.wholechap:hover{background:var(--rubric);color:var(--text)}
.pickhint{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin:0 0 9px;
}
.verselist button.inrange{border-color:var(--verdigris);color:var(--verdigris)}
.verselist button.startv{background:var(--verdigris);color:var(--ground);border-color:var(--verdigris)}
.panel-back{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--rubric);
  background:none;border:0;cursor:pointer;padding:0;margin-bottom:11px;
}
.cmd{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold);
  background:var(--ground);border:1px solid var(--edge);border-radius:6px;
  padding:11px 13px;margin:10px 0 0;overflow-x:auto;white-space:pre-wrap;
  word-break:break-all;
}
.panel-filter{
  font-size:13.5px;width:100%;padding:8px 10px;margin-bottom:12px;
  border:1px solid var(--edge);background:var(--raised2);border-radius:5px;color:var(--text);
}

/* ── layout ───────────────────────────────────────────── */
.sheet{
  max-width:1280px;margin:0 auto;padding:26px 26px 100px;
  display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:34px;align-items:start;
}
@media(max-width:1000px){.sheet{grid-template-columns:1fr;gap:26px}}
/* Pin each pane to its column. Without this, an empty scripture pane
   collapses out of the grid and the findings slide into the narrow slot. */
.passage{grid-column:1}
.apparatus{grid-column:2;min-width:0}
/* Before a search there is no scripture pane, so the findings column would
   sit against an empty half-page. Let it span the full width until there is
   something to sit beside. */
.sheet:has(.passage:empty) .apparatus{grid-column:1 / -1}
@media(max-width:1000px){.passage,.apparatus{grid-column:1}}

/* ── scripture: the hero ──────────────────────────────── */
.passage{
  /* start rather than sticky-to-top: a one-verse passage otherwise pins a
     short card beside 2000px of findings, leaving most of the column empty */
  position:sticky;align-self:start;top:20px;
  background:var(--raised);border:1px solid var(--edge);
  border-radius:11px;padding:24px 26px;box-shadow:var(--shadow);
  max-height:calc(100vh - 44px);overflow-y:auto;
}
@media(max-width:1000px){.passage{position:static;max-height:none}}
.passage:empty{display:none}
.passage-head{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding-bottom:11px;margin-bottom:18px;border-bottom:1px solid var(--edge);
}
.passage-ref{
  font-family:"EB Garamond",Georgia,serif;font-size:25px;font-weight:600;
  color:var(--gold);line-height:1.15;
}
.passage-trans{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-left:auto;
}
.verse{
  font-family:"EB Garamond",Georgia,serif;font-size:20.5px;line-height:1.72;
  margin:0 0 13px;color:var(--text);
}
.vnum{
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--gold);
  vertical-align:.62em;margin-right:6px;user-select:none;opacity:.85;
}
.hubtag{
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--verdigris);border:1px solid var(--verdigris);
  padding:1px 5px;border-radius:3px;margin-left:7px;vertical-align:.2em;
}
.alt-trans{margin-top:20px;padding-top:15px;border-top:1px solid var(--edge)}
.alt-trans summary{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;
}
.alt-trans summary:hover{color:var(--gold)}
.alt-trans p{font-family:"EB Garamond",Georgia,serif;font-size:16.5px;color:var(--text-dim);margin:12px 0 0;line-height:1.65}

/* ── interlinear ──────────────────────────────────────── */
.iltoggle{display:flex;justify-content:flex-end;margin-bottom:10px}
.iltoggle button{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--raised2);color:var(--muted);
  border:1px solid var(--edge);border-radius:12px;padding:4px 12px;cursor:pointer;
}
.iltoggle button:hover{color:var(--gold);border-color:var(--gold)}
.ilv{padding:12px 0;border-bottom:1px solid var(--edge)}
.ilv:last-child{border-bottom:0}
.ilv-ref{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--gold);margin-bottom:8px;letter-spacing:.06em}
.ilv-words{display:flex;flex-wrap:wrap;gap:9px}
.ilv-words.rtl{direction:rtl}
.ilw{
  display:flex;flex-direction:column;gap:1px;padding:6px 9px;
  background:var(--raised2);border-radius:6px;border:1px solid transparent;
  min-width:52px;cursor:help;direction:ltr;
}
.ilw:hover{border-color:var(--verdigris)}
.ilw-o{font-family:"EB Garamond",Georgia,serif;font-size:19px;color:var(--gold);line-height:1.3}
.ilw-t{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);font-style:italic}
.ilw-g{font-size:12.5px;color:var(--text);line-height:1.3}
.ilw-s{font-family:"IBM Plex Mono",monospace;font-size:8px;color:var(--verdigris);opacity:.7}

/* ── findings: cards, not a wall ──────────────────────── */
.apparatus > section{
  background:var(--raised);border:1px solid var(--edge);border-radius:11px;
  padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow);scroll-margin-top:18px;
}
.sec-head{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 15px;
  padding-bottom:10px;border-bottom:1px solid var(--edge);
}
.sec-title{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;
  text-transform:uppercase;letter-spacing:.14em;color:var(--gold);
}
.sec-note{font-size:12px;color:var(--muted);margin-left:auto;font-style:italic}

.summary-text{font-family:"EB Garamond",Georgia,serif;font-size:20px;line-height:1.6;margin:0;color:var(--text)}
.scope{
  font-family:"EB Garamond",Georgia,serif;font-size:18.5px;line-height:1.6;
  margin:0;padding-left:15px;border-left:2px solid var(--verdigris);color:var(--text);
}
.ctx{display:grid;gap:14px}
.ctx div{font-size:14.5px;line-height:1.6;color:var(--text-dim)}
.ctx b{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:3px;font-weight:500;
}

/* claims — certainty shown as bar length */
.claim{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--edge)}
.claim:last-child{border-bottom:0}.claim:first-child{padding-top:0}
.cert{flex:0 0 38px;padding-top:6px}
.cert i{display:block;height:3px;border-radius:2px;background:var(--gold);margin-bottom:4px}
.cert[data-c="explicit"] i{width:38px}
.cert[data-c="strongly_implied"] i{width:24px;background:var(--verdigris)}
.cert[data-c="inferred"] i{width:12px;background:var(--muted)}
.cert small{
  font-family:"IBM Plex Mono",monospace;font-size:8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;display:block;
}
.claim-body{flex:1;font-size:15px;line-height:1.6;color:var(--text)}

/* sigla */
.sig{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--verdigris);
  border:1px solid var(--verdigris);border-radius:3px;padding:1px 5px;margin-left:6px;
  cursor:help;opacity:.8;transition:all .12s;
  display:inline-block;max-width:100%;overflow-wrap:anywhere;
}
.sig:hover{background:var(--verdigris);color:var(--ground);opacity:1}

/* the original-language line above the word cards */
.origline{
  background:var(--ground);border:1px solid var(--edge);border-radius:8px;
  padding:13px 15px;margin-bottom:14px;
}
.origline-head{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--verdigris);
}
.origline-note{color:var(--muted);text-transform:none;letter-spacing:.02em;
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11px;font-style:italic}
.origline-verse{
  font-family:"EB Garamond",Georgia,serif;font-size:19px;line-height:1.95;
  margin:0 0 7px;color:var(--text-dim);
}
.origline-verse.rtl{direction:rtl;text-align:right}
.origline-verse:last-child{margin-bottom:0}
.origline-ref{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);
  vertical-align:.55em;margin-right:7px;direction:ltr;display:inline-block;
}
.ow{cursor:help;border-radius:3px;padding:0 2px;transition:all .15s;
  display:inline-block;position:relative}
.ow-n{
  font-family:"IBM Plex Mono",monospace;font-size:8px;color:var(--muted);
  vertical-align:super;margin-right:2px;user-select:none;direction:ltr;
  display:inline-block;
}
.ow.lit .ow-n{color:var(--gold);opacity:.8}
.term-at{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--verdigris);
  margin-top:8px;letter-spacing:.04em;
}
.ow:hover{color:var(--text)}
.ow.lit{color:var(--gold);border-bottom:1px solid rgba(212,166,74,.45)}
.ow.focus{background:var(--gold);color:var(--ground);border-bottom-color:transparent}

/* word study */
.terms{display:grid;gap:12px}
.term{
  background:var(--raised2);border-left:3px solid var(--rubric);
  border-radius:0 7px 7px 0;padding:14px 16px;cursor:pointer;
}
.term:hover{border-left-color:var(--gold)}
.term-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.term-orig{font-family:"EB Garamond",Georgia,serif;font-size:25px;color:var(--gold);line-height:1.1}
.term-tr{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);font-style:italic}
.term-sur{font-family:"EB Garamond",Georgia,serif;font-size:16px;color:var(--rubric)}
.term-why{font-size:14.5px;line-height:1.6;margin:0;color:var(--text-dim)}

/* disputed — facing columns, like a diglot page */
.dispute{
  border:1px solid var(--verdigris);border-radius:9px;overflow:hidden;
  margin-bottom:15px;min-width:0;
}
.dispute-q{
  font-family:"EB Garamond",Georgia,serif;font-size:19px;font-weight:600;
  margin:0;padding:14px 16px 5px;color:var(--text);
}
.dispute-why{font-size:13.5px;color:var(--muted);margin:0;padding:0 16px 13px;font-style:italic}
/* min-width:0 is required on grid children. Their default of min-width:auto
   means a column refuses to shrink below its content's intrinsic minimum —
   and the citation chips below are white-space:nowrap, so a run of them sets
   a floor wider than the card. The grid then overflows and the parent's
   overflow:hidden silently clips the right-hand position mid-sentence. */
.positions{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:1px;background:var(--edge);
}
@media(max-width:680px){.positions{grid-template-columns:minmax(0,1fr)}}
.pos{background:var(--raised2);padding:14px 16px;min-width:0;overflow-wrap:anywhere}
.pos-held{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--verdigris);margin-bottom:6px;
}
.pos-view{font-family:"EB Garamond",Georgia,serif;font-size:17px;font-weight:600;margin:0 0 7px;line-height:1.35;color:var(--text)}
.pos-reason{font-size:13.5px;line-height:1.6;margin:0;color:var(--text-dim)}
.pos-texts{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  margin-top:9px;overflow-wrap:anywhere}
.dispute-foot{
  font-size:12.5px;color:var(--muted);padding:11px 16px;
  background:var(--raised);border-top:1px solid var(--verdigris);
}

/* misreadings — editorial correction marks */
.misread{padding:12px 0;border-bottom:1px solid var(--edge)}
.misread:last-child{border-bottom:0}.misread:first-child{padding-top:0}
/* Strikethrough over a whole sentence is close to unreadable — the rule cuts
   through the x-height of every letter, and the muted colour was fighting it.
   A red bar and a label say "this is the wrong reading" without damaging the
   text, and the reader has to be able to read the misreading to recognise it
   as one. */
.misread-x{
  font-family:"EB Garamond",Georgia,serif;font-size:16.5px;
  color:var(--text-dim);margin:0 0 8px;line-height:1.5;
  padding-left:13px;border-left:3px solid var(--rubric);
}
.misread-x:before{
  content:"Often heard as";display:block;
  font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--rubric);margin-bottom:4px;
}
.misread-fix:before{
  content:"But the text says";display:block;
  font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--verdigris);margin-bottom:4px;
}
.misread-fix{padding-left:13px;border-left:3px solid var(--verdigris)}
.misread-fix{font-size:14.5px;line-height:1.6;margin:0;color:var(--text)}

.misuse{
  border:1px solid var(--rubric);border-radius:9px;padding:15px 17px;margin-bottom:13px;
  background:var(--raised2);
}
.misuse-ref{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--rubric);margin-bottom:8px;letter-spacing:.04em}
.misuse-pop{font-family:"EB Garamond",Georgia,serif;font-size:16px;color:var(--muted);margin:0 0 9px;line-height:1.5}
.misuse-pop:before{
  content:"Quoted to prove — ";font-family:"IBM Plex Mono",monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
}
.misuse-real{font-size:14.5px;line-height:1.6;margin:0;color:var(--text)}
.misuse-real:before{
  content:"In context — ";font-family:"IBM Plex Mono",monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.09em;color:var(--rubric);
}

/* key passages / connections */
.kp,.conn{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid var(--edge);font-size:14.5px;line-height:1.6}
.kp:last-child,.conn:last-child{border-bottom:0}
.kp:first-child,.conn:first-child{padding-top:0}
.kp-ref,.conn-ref{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--rubric);
  flex:0 0 100px;padding-top:3px;letter-spacing:.02em;
}
.kp-w{
  font-family:"IBM Plex Mono",monospace;font-size:8px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);border:1px solid var(--edge);
  padding:2px 6px;border-radius:10px;margin-left:8px;white-space:nowrap;
}
.kp-w[data-w="central"]{color:var(--gold);border-color:var(--gold)}

/* quiet / deeper */
.quiet,.deeper{background:var(--raised2);border:1px solid var(--edge);border-radius:8px;padding:15px 18px}
.quiet ul,.deeper ul{margin:0;padding-left:20px}
.quiet li,.deeper li{font-size:14.5px;margin-bottom:8px;line-height:1.6;color:var(--text-dim)}
.quiet li::marker,.deeper li::marker{color:var(--gold)}
.deeper p{font-size:13px;color:var(--muted);margin:13px 0 0;font-style:italic;line-height:1.6}

/* ── grounding, promoted ──────────────────────────────── */
.integrity{background:var(--raised2)!important}
.meter{display:flex;gap:2px;margin:11px 0 9px}
.meter i{flex:1;height:11px;border-radius:2px;background:var(--edge)}
.meter i.on{background:var(--verdigris)}
.meter i.off{background:var(--rubric)}
.integrity-line{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);line-height:1.85}
.integrity details{margin-top:11px}
.integrity summary{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--rubric);cursor:pointer}
.integrity li{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-bottom:5px}

.groundbadge{
  display:flex;align-items:center;gap:11px;background:var(--raised);
  border:1px solid var(--verdigris);border-radius:9px;padding:11px 16px;margin-bottom:16px;
}
.groundbadge .gb-n{font-family:"EB Garamond",Georgia,serif;font-size:26px;color:var(--verdigris);line-height:1}
.groundbadge .gb-t{font-size:13px;color:var(--text-dim);line-height:1.4}
.groundbadge .gb-t b{color:var(--text);font-weight:600}
.groundbadge.warn{border-color:var(--rubric)}
.groundbadge.warn .gb-n{color:var(--rubric)}

/* ── section nav ──────────────────────────────────────── */
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.secnav a{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);text-decoration:none;
  border:1px solid var(--edge);border-radius:14px;padding:5px 11px;
  background:var(--raised);transition:all .15s;
}
.secnav a:hover{color:var(--gold);border-color:var(--gold)}

/* ── sermon workbench ─────────────────────────────────── */
select{
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;color:var(--text);
  background:var(--raised);border:1px solid var(--edge);border-radius:6px;
  padding:11px 10px;width:100%;cursor:pointer;
}
select:focus{outline:none;border-color:var(--gold)}
.exportbar{display:flex;gap:7px;margin-bottom:14px}
.exportbar button{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--raised);color:var(--muted);
  border:1px solid var(--edge);border-radius:14px;padding:6px 14px;cursor:pointer;
}
.exportbar button:hover{color:var(--gold);border-color:var(--gold)}
.bigidea{
  font-family:"EB Garamond",Georgia,serif;font-size:22px;line-height:1.5;
  margin:0;color:var(--text);
}
.shape{font-size:14px;color:var(--text-dim);margin:14px 0 0;line-height:1.6}
.shape b{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:3px;
}
.mv{display:flex;gap:15px;padding:15px 0;border-bottom:1px solid var(--edge)}
.mv:last-child{border-bottom:0}.mv:first-child{padding-top:0}
.mv-n{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--gold);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:"EB Garamond",Georgia,serif;font-size:15px;
}
.mv-body{flex:1;min-width:0}
.mv-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.mv-title{font-family:"EB Garamond",Georgia,serif;font-size:19px;font-weight:600;color:var(--text)}
.mv-ref{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--rubric)}
.mv-point{font-size:14.5px;line-height:1.62;margin:0;color:var(--text-dim)}
.mv-det{margin:9px 0 0;padding-left:19px}
.mv-det li{font-size:13.5px;line-height:1.55;color:var(--text-dim);margin-bottom:4px}
.mv-det li::marker{color:var(--gold)}
.mv-ill{
  margin-top:11px;padding:10px 13px;background:var(--raised2);
  border-left:2px solid var(--verdigris);border-radius:0 6px 6px 0;
}
.mv-ill b{
  font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--verdigris);display:block;margin-bottom:6px;
}
.mv-ill ul{margin:0;padding-left:17px}
.mv-ill li{font-size:13.5px;line-height:1.55;color:var(--text-dim);margin-bottom:4px;font-style:italic}

.mv-min{
  font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--gold);
  border:1px solid var(--gold);border-radius:10px;padding:1px 7px;margin-left:auto;
}
.mv-read,.mv-deliv,.mv-trans{font-size:13.5px;line-height:1.55;margin:9px 0 0;color:var(--text-dim)}
.mv-read b,.mv-deliv b,.mv-trans b{
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:3px;
}
.mv-read{padding-left:11px;border-left:2px solid var(--rubric)}
.mv-trans{
  padding:9px 12px;background:var(--ground);border-radius:6px;
  font-family:"EB Garamond",Georgia,serif;font-size:15.5px;color:var(--text);
}
.mv-trans b{font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--gold)}
.drift{padding:11px 0;border-bottom:1px solid var(--edge)}
.drift:last-child{border-bottom:0}.drift:first-child{padding-top:0}
.drift-m{font-family:"EB Garamond",Georgia,serif;font-size:16.5px;color:var(--text);margin-bottom:4px}
.drift-w{font-size:13.5px;color:var(--muted);margin:0 0 5px;line-height:1.55}
.drift-h{font-size:14px;color:var(--verdigris);margin:0;line-height:1.55}
.cutlist{margin:0;padding-left:22px;counter-reset:cut}
.cutlist li{font-size:14.5px;line-height:1.6;color:var(--text-dim);margin-bottom:7px}
.cutlist li::marker{color:var(--rubric);font-family:"IBM Plex Mono",monospace;font-size:12px}

/* ── history drawer ───────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:100;
  background:var(--raised);border-left:1px solid var(--edge);
  transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3);
}
.drawer.open{transform:none}
.drawer-head{
  display:flex;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--edge);
}
.drawer-title{font-family:"EB Garamond",Georgia,serif;font-size:20px;color:var(--gold)}
.drawer-x{
  margin-left:auto;background:none;border:0;color:var(--muted);
  font-size:15px;cursor:pointer;padding:2px 6px;
}
.drawer-x:hover{color:var(--rubric)}
.drawer-tabs{display:flex;gap:5px;padding:12px 18px;border-bottom:1px solid var(--edge)}
.drawer-tabs button{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--raised2);color:var(--muted);
  border:1px solid var(--edge);border-radius:13px;padding:5px 13px;cursor:pointer;
}
.drawer-tabs button[aria-pressed="true"]{background:var(--gold);color:var(--ground);border-color:var(--gold)}
.drawer-body{flex:1;overflow-y:auto;padding:10px 12px 24px}
.hist-empty{font-size:13.5px;color:var(--muted);padding:18px 8px;line-height:1.6;font-style:italic}
.hist{display:flex;align-items:flex-start;gap:2px;border-bottom:1px solid var(--edge)}
.hist:last-child{border-bottom:0}
.hist-open{
  flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;
  padding:11px 8px;display:block;color:var(--text);border-radius:6px;
}
.hist-open:hover{background:var(--raised2)}
.hist-kind{
  font-family:"IBM Plex Mono",monospace;font-size:8px;text-transform:uppercase;
  letter-spacing:.09em;border:1px solid var(--edge);border-radius:9px;
  padding:1px 6px;color:var(--muted);margin-right:7px;
}
.hist-kind[data-k="sermon"]{color:var(--gold);border-color:var(--gold)}
.hist-kind[data-k="topic"]{color:var(--verdigris);border-color:var(--verdigris)}
.hist-title{font-family:"EB Garamond",Georgia,serif;font-size:16px}
.hist-detail{
  display:block;font-size:12.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hist-when{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  color:var(--muted);margin-top:4px;
}
.hist-star,.hist-del{
  background:none;border:0;cursor:pointer;color:var(--muted);
  font-size:14px;padding:11px 5px;line-height:1;
}
.hist-star.on{color:var(--gold)}
.hist-star:hover{color:var(--gold)}
.hist-del{font-size:11px}
.hist-del:hover{color:var(--rubric)}

/* ── toolbar, flag, resume ────────────────────────────── */
.toolbar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.toolbar button{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--raised);color:var(--muted);
  border:1px solid var(--edge);border-radius:13px;padding:6px 14px;cursor:pointer;
}
.toolbar button:hover{color:var(--gold);border-color:var(--gold)}
.toolbar .flagbtn{margin-left:auto}
.toolbar .flagbtn:hover{color:var(--rubric);border-color:var(--rubric)}
.flagmodal{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.flagcard{
  background:var(--raised);border:1px solid var(--edge);border-radius:11px;
  padding:22px 24px;width:min(440px,94vw);box-shadow:var(--shadow);
}
.authwhy{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.auth-err{color:var(--rubric);font-size:13px;margin:10px 0 0;min-height:1em}
.flagcard input[type=email],.flagcard input[type=password],.flagcard input[type=text]{
  width:100%;background:var(--raised2);border:1px solid var(--edge);
  border-radius:6px;padding:10px 12px;color:var(--text);font-size:15px;
}
.flagcard input:focus{outline:none;border-color:var(--gold)}
.usertable{border:1px solid var(--edge);border-radius:8px;margin:14px 0;overflow:hidden}
.ut-head{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);padding:9px 12px;
  border-bottom:1px solid var(--edge);background:var(--raised2);
}
.ut-row{display:flex;align-items:center;gap:12px;padding:9px 12px;
  border-bottom:1px solid var(--edge);font-size:13px}
.ut-row:last-child{border-bottom:0}
.ut-who{flex:1;min-width:0}
.ut-who small{display:block;color:var(--muted);font-size:11px}
.ut-n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.ut-c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--verdigris);min-width:52px;text-align:right}
.ut-reset{
  background:none;border:1px solid var(--edge);border-radius:5px;color:var(--muted);
  cursor:pointer;font-size:13px;padding:3px 8px;line-height:1;
}
.ut-reset:hover{color:var(--gold);border-color:var(--gold)}
.ac-temp{font-size:13px;color:var(--verdigris);margin:12px 0 0;line-height:1.6}
.ac-temp.bad{color:var(--rubric)}
.ac-temp code{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:17px;
  color:var(--gold);background:var(--ground);border:1px solid var(--gold);
  border-radius:6px;padding:10px 13px;margin-top:8px;letter-spacing:.04em;
  user-select:all;
}
.flagcard h3{font-family:"EB Garamond",Georgia,serif;font-size:20px;margin:0 0 16px;color:var(--rubric)}
.flagcard label{display:block;margin:12px 0 5px}
.flagcard select,.flagcard textarea{
  width:100%;background:var(--raised2);border:1px solid var(--edge);
  border-radius:6px;padding:9px 11px;color:var(--text);font-size:14px;
  font-family:"IBM Plex Sans",system-ui,sans-serif;
}
.flagcard textarea{resize:vertical}
.flagrow{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.flagrow button{
  background:none;border:1px solid var(--edge);border-radius:6px;
  padding:8px 16px;color:var(--muted);cursor:pointer;font-size:13px;
}
/* .flagrow button strips the background, and being two-class specific it wins
   over .notesave. The override restored the text colour but not the fill, so
   the primary button rendered dark-on-dark and looked like empty space. Both
   properties have to come back together. */
.flagrow .notesave{
  border:0;background:var(--verdigris);color:var(--ground);font-weight:500;
}
.flagrow .notesave:hover{background:var(--gold);color:var(--ground)}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:220;
  background:var(--verdigris);color:var(--ground);padding:11px 22px;
  border-radius:22px;font-size:13.5px;font-weight:500;
}
.resume{
  display:block;width:100%;text-align:left;background:var(--raised2);
  border:1px solid var(--gold);border-radius:8px;padding:11px 15px;
  color:var(--gold);cursor:pointer;margin-bottom:18px;font-size:14px;
  font-family:"IBM Plex Sans",system-ui,sans-serif;
}
.resume:hover{background:var(--gold);color:var(--ground)}
.drawer-search{padding:0 18px 12px}
.drawer-search input{
  width:100%;background:var(--raised2);border:1px solid var(--edge);
  border-radius:6px;padding:8px 11px;color:var(--text);font-size:13.5px;
}
.drawer-search input:focus{outline:none;border-color:var(--gold)}

/* ── notes ────────────────────────────────────────────── */
.notes{border-color:var(--verdigris)!important}
.noteinput{
  width:100%;font-family:"EB Garamond",Georgia,serif;font-size:16px;
  color:var(--text);background:var(--raised2);border:1px solid var(--edge);
  border-radius:7px;padding:11px 13px;resize:vertical;line-height:1.55;
}
.noteinput:focus{outline:none;border-color:var(--verdigris)}
.noterow{display:flex;align-items:center;gap:11px;margin-top:9px}
.notesave{
  font-size:13px;font-weight:500;background:var(--verdigris);color:var(--ground);
  border:0;border-radius:6px;padding:8px 18px;cursor:pointer;
}
.notesave:hover{background:var(--gold)}
.notehint{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--verdigris)}
.note{padding:12px 0;border-bottom:1px solid var(--edge)}
.note:last-child{border-bottom:0}
.note-body{
  font-family:"EB Garamond",Georgia,serif;font-size:16.5px;line-height:1.6;
  margin:0 0 7px;color:var(--text);white-space:pre-wrap;
}
.note-meta{display:flex;align-items:center;gap:12px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}
.note-meta button{
  background:none;border:0;color:var(--muted);cursor:pointer;padding:0;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.07em;
}
.note-meta button:hover{color:var(--gold)}
.note-meta button.note-del:hover{color:var(--rubric)}
.note-empty{font-size:13.5px;color:var(--muted);font-style:italic;margin:14px 0 0}

/* ── progress ─────────────────────────────────────────── */
.progress{
  background:var(--raised);border:1px solid var(--edge);border-radius:11px;
  padding:20px 24px;box-shadow:var(--shadow);
}
.prog-rows{display:flex;flex-direction:column;gap:11px}
.prog-row{
  display:flex;align-items:flex-start;gap:11px;font-size:14.5px;
  color:var(--muted);line-height:1.5;
}
.prog-row.live{color:var(--text)}
.prog-row.done{color:var(--muted)}
.prog-dot{
  flex:0 0 8px;height:8px;border-radius:50%;background:var(--edge);margin-top:6px;
}
.prog-row.live .prog-dot{
  background:var(--gold);
  animation:pulse 1.3s ease-in-out infinite;
}
.prog-row.done .prog-dot{background:var(--verdigris)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.prog-row.live .prog-dot{animation:none}}
.prog-foot{
  display:flex;align-items:baseline;gap:12px;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--edge);
}
#prog-time{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--gold)}
.prog-note{font-size:12.5px;color:var(--muted);font-style:italic}
.prog-stop{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;background:none;
  border:1px solid var(--edge);border-radius:12px;color:var(--muted);
  padding:4px 12px;cursor:pointer;
}
.prog-stop:hover{color:var(--rubric);border-color:var(--rubric)}
.livehint{display:flex;align-items:center;gap:10px}

/* ── live rendering ───────────────────────────────────── */
.livehint{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--gold);margin:0 0 14px;
}
.livehint:after{content:"";animation:dots 1.4s steps(4,end) infinite}
/* Live sections live inside #live, so they miss `.apparatus > section` and
   render unstyled — then snap into cards when the final payload replaces
   them. Same card treatment, so the transition is invisible. */
#live > section{
  background:var(--raised);border:1px solid var(--edge);border-radius:11px;
  padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow);
  animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
}
#live .live-body > *:first-child{padding-top:0}

/* ── states ───────────────────────────────────────────── */
.msg{
  font-family:"EB Garamond",Georgia,serif;font-size:18px;color:var(--text-dim);
  background:var(--raised);border:1px solid var(--edge);border-left:3px solid var(--rubric);
  border-radius:0 9px 9px 0;padding:18px 22px;margin:0;
}
.msg.working{border-left-color:var(--gold)}
.msg small{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--muted);margin-top:7px;letter-spacing:.05em;
}
.msg.working small:after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:" ."}50%{content:" .."}75%{content:" ..."}}
.empty{
  background:var(--raised);border:1px solid var(--edge);border-radius:11px;
  padding:26px 28px;max-width:620px;box-shadow:var(--shadow);
}
.empty h2{font-family:"EB Garamond",Georgia,serif;font-size:24px;font-weight:600;margin:0 0 13px;color:var(--gold)}
.empty p{font-size:15px;line-height:1.68;color:var(--text-dim);margin:0 0 13px}
.empty p:last-child{margin-bottom:0}
/* The verse the whole thing is named after. Set quietly — it is a reason, not
   a slogan, and it should read as an epigraph rather than a banner. */
.ways{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--edge)}
.ways-h{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);margin-bottom:12px;
}
.way{
  display:block;width:100%;text-align:left;background:var(--raised2);
  border:1px solid var(--edge);border-radius:8px;padding:12px 15px;
  margin-bottom:8px;cursor:pointer;color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
}
.way:hover{border-color:var(--gold)}
.way-n{
  display:block;font-family:"EB Garamond",Georgia,serif;font-size:17px;
  font-weight:600;color:var(--gold);margin-bottom:3px;
}
.way-d{display:block;font-size:13.5px;line-height:1.5;color:var(--text-dim)}
.trythis{
  display:block;width:100%;text-align:left;margin-top:16px;cursor:pointer;
  background:var(--raised2);border:1px solid var(--rubric);border-radius:8px;
  padding:13px 16px;color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
}
.trythis:hover{background:var(--rubric);color:var(--ground)}
.trythis:hover .try-n,.trythis:hover .try-d{color:var(--ground)}
.try-n{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--rubric);margin-bottom:5px;
}
.try-d{display:block;font-size:14px;line-height:1.5;color:var(--text-dim)}
.introverse{
  margin:20px 0 0;padding:16px 0 0;border-top:1px solid var(--edge);
  font-family:"EB Garamond",Georgia,serif;font-size:16.5px;line-height:1.6;
  color:var(--text-dim);font-style:italic;
}
.introverse cite{
  display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);font-style:normal;
}

footer{border-top:1px solid var(--edge);padding:20px 26px;font-size:12px;color:var(--muted);background:var(--raised)}
footer div{max-width:1280px;margin:0 auto;line-height:1.7}
.scopenote{margin-top:8px;padding-top:8px;border-top:1px solid var(--edge);color:var(--text-dim)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

@media(prefers-reduced-motion:no-preference){
  .apparatus > section{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
  .apparatus > section:nth-child(2){animation-delay:.04s}
  .apparatus > section:nth-child(3){animation-delay:.08s}
  .apparatus > section:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
}
/* ── print ────────────────────────────────────────────────
   Paper is white and ink is expensive, so the dark theme is forced back to
   black-on-white regardless of the toggle. Chrome, controls and the notes box
   are dropped; the passage and the findings are what gets carried into the
   pulpit or the study.                                                      */
@media print{
  :root, [data-theme="dark"], [data-theme="light"]{
    --ground:#fff; --raised:#fff; --raised2:#fff; --edge:#bbb;
    --text:#000; --text-dim:#222; --muted:#555;
    --rubric:#8a2b22; --gold:#6b5310; --verdigris:#1f5450;
    --shadow:none; --glow:none;
  }
  body{background:#fff;font-size:11pt}
  .masthead,.query,.drawer,.scrim,.toolbar,.secnav,.notes,.iltoggle,
  .exportbar,.integrity details,footer .scopenote{display:none!important}
  .sheet{display:block;max-width:100%;padding:0}
  .passage{
    position:static;max-height:none;overflow:visible;page-break-after:avoid;
    border:0;border-bottom:2px solid #000;border-radius:0;padding:0 0 12pt;
    margin-bottom:14pt;box-shadow:none;
  }
  .apparatus > section{
    border:0;border-top:1px solid #ccc;border-radius:0;padding:10pt 0 0;
    margin:0 0 12pt;box-shadow:none;page-break-inside:avoid;animation:none;
  }
  .verse{font-size:12pt;line-height:1.5}
  .positions{grid-template-columns:1fr 1fr;gap:0}
  .pos{border:1px solid #ccc}
  .sig{border:0;padding:0;color:#666;font-size:8pt}
  .mv,.claim,.kp,.conn{page-break-inside:avoid}
  a[href]:after{content:""}
  footer{border-top:1px solid #999;font-size:8pt;padding:8pt 0 0}
}

@media(max-width:560px){
  /* The tagline costs a whole line on a phone and says nothing the app
     doesn't demonstrate in five seconds. */
  .tagline{display:none}
  .mark{display:inline-block;width:34px;height:34px;flex:0 0 34px}
.mark svg{width:100%;height:100%;display:block}
@media(max-width:560px){.mark{width:28px;height:28px;flex:0 0 28px}}
.wordmark{font-size:23px}
  .masthead-inner{gap:10px}
  .sheet{padding:18px 15px 70px}
  .query{padding:16px 15px 0}
  .masthead{padding:14px 15px}
  .verse{font-size:19px}
  .apparatus > section,.passage{padding:16px 17px}
}
</style>

// Preference keys moved with the rename. Copy the old values across once so
// nobody's theme, language or tradition resets just because the app changed
// its name — then the old keys are removed.
(function migratePrefs(){
  const pairs = [["apparatus-lang","adfontes-lang"], ["apparatus-theme","adfontes-theme"],
                 ["apparatus-lens","adfontes-lens"], ["apparatus-last","adfontes-last"]];
  try{
    for(const [old, now] of pairs){
      const v = localStorage.getItem(old);
      if(v !== null && localStorage.getItem(now) === null) localStorage.setItem(now, v);
      if(v !== null) localStorage.removeItem(old);
    }
  }catch{}
})();

function setLanguage(l){
  if(l === LANG) return;
  cancelRun(true);
  LANG = l;
  localStorage.setItem("adfontes-lang", l);
  // Reset to the intro; a study written in the other language would be stale.
  $("#passage").innerHTML = "";
  $("#apparatus").innerHTML = `<div class="empty" id="intro"></div>`;
  $("#ref").value = ""; $("#q").value = "";
  $("#picker-label").textContent = STR[l].phRef.split(":")[0];
  BOOKS_MISSING = null;
  if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
applyLanguage();
}

let EV = {};   // siglum -> evidence item, for hover text
let INTERLINEAR = [], SHOW_ORIGINAL = false;

function sigTitle(sig){
  const e = EV[sig];
  if(!e) return sig;
  if(e.__kind === "commentary") return `${e.source}${e.author ? " — " + e.author : ""}${e.year ? " (" + e.year + ")" : ""}\n${e.tradition || ""}\n\n${e.text.slice(0,600)}`;
  if(e.__kind === "word") return `${e.lemma || ""} ${e.translit ? "(" + e.translit + ")" : ""}\n${e.definition || ""}\n\nKJV renders: ${e.kjv_usage || "—"}`;
  if(e.__kind === "xref")  return `${e.ref}\n\n${e.text}`;
  return `${e.ref}\n\n${e.text}`;
}
const sig = s => `<span class="sig" title="${esc(sigTitle(s))}">${esc(s)}</span>`;
const sigs = a => (a||[]).map(sig).join("");

function indexEvidence(ev){
  EV = {};
  (ev.passage    || []).forEach(x => EV[x.siglum] = {...x, __kind:"verse"});
  (ev.words      || []).forEach(x => EV[x.siglum] = {...x, __kind:"word"});
  (ev.cross_refs || []).forEach(x => EV[x.siglum] = {...x, __kind:"xref"});
  (ev.commentary || []).forEach(x => EV[x.siglum] = {...x, __kind:"commentary"});
}

// The interlinear is grouped by verse and laid out as word blocks, each
// carrying the original, its transliteration, the contextual gloss and the
// parsed morphology. Hebrew blocks flow right-to-left; the reading order of
// the words is what makes an interlinear worth having.
function renderInterlinear(ref){
  if(!INTERLINEAR.length) return "";
  const t = T();
  const byVerse = {};
  INTERLINEAR.forEach(w => (byVerse[w.vid] = byVerse[w.vid] || []).push(w));
  const heb = INTERLINEAR[0].script === "hebrew";
  return `<div class="passage-head">
      <span class="passage-ref">${esc(ref)}</span>
      <span class="passage-trans">${esc(t.interlinearNote)}</span></div>` +
    Object.keys(byVerse).map(vid => {
      const ws = byVerse[vid];
      return `<div class="ilv">
        <div class="ilv-ref">${esc(ws[0].ref)}</div>
        <div class="ilv-words${heb ? " rtl" : ""}">${ws.map(w => `
          <div class="ilw" title="${esc(w.morph || "")}">
            <span class="ilw-o">${esc(w.original)}</span>
            ${w.translit ? `<span class="ilw-t">${esc(w.translit)}</span>` : ""}
            <span class="ilw-g">${esc(w.gloss)}</span>
            ${w.strongs ? `<span class="ilw-s">${esc(w.strongs)}</span>` : ""}
          </div>`).join("")}</div>
      </div>`;
    }).join("");
}

function paintPassage(){
  const box = $("#passage");
  if(SHOW_ORIGINAL && INTERLINEAR.length){
    box.innerHTML = box.dataset.toggle + renderInterlinear(box.dataset.ref || "");
  } else {
    box.innerHTML = box.dataset.toggle + (box.dataset.english || "");
  }
  const b = $("#il-toggle");
  if(b){
    b.textContent = SHOW_ORIGINAL ? T().showEnglish : T().showOriginal;
    b.addEventListener("click", () => { SHOW_ORIGINAL = !SHOW_ORIGINAL; paintPassage(); });
  }
}

// The picker label is a display of the current reference, not an independent
// control. It has to follow the ref field however that field was set — typed,
// clicked from an example, or restored from history — otherwise it keeps
// advertising the last passage chosen from the menu.
function syncPickerLabel(){
  const el = $("#picker-label");
  const v = ($("#ref")?.value || "").trim();
  if(el) el.textContent = v || (T().phRef.split(":")[0]);
}

function renderPassage(ref, verses){
  const primary = verses.filter(v => v.translation === verses[0].translation);
  const others  = verses.filter(v => v.translation !== verses[0].translation);
  let h = `<div class="passage-head">
      <span class="passage-ref">${esc(ref)}</span>
      <span class="passage-trans">${esc(primary[0]?.translation || "")}</span>
    </div>`;
  h += primary.map(v =>
    `<p class="verse"><span class="vnum">${esc(v.ref.split(":").pop())}</span>${esc(v.text)}</p>`
  ).join("");
  if(others.length){
    const t = others[0].translation;
    h += `<details class="alt-trans"><summary>${esc(T().compare(t))}</summary>
      <p>${others.map(v => esc(v.text)).join(" ")}</p></details>`;
  }
  const box = $("#passage");
  box.dataset.ref = ref;
  box.dataset.english = h;
  box.dataset.toggle = INTERLINEAR.length
    ? `<div class="iltoggle"><button id="il-toggle"></button></div>` : "";
  paintPassage();
}



function renderStudy(d){
  const s = d.study, ev = d.evidence, ig = d.integrity;
  let h = "";

  if(s.summary){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secSummary)}</span>
      ${s.context?.genre ? `<span class="sec-note">${esc(s.context.genre)}</span>` : ""}</div>
      <p class="summary-text">${esc(s.summary)}</p></section>`;
  }

  if(s.context && (s.context.literary || s.context.historical)){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secContext)}</span></div>
      <div class="ctx">
        ${s.context.literary   ? `<div><b>${esc(T().ctxBook)}</b>${esc(s.context.literary)}</div>` : ""}
        ${s.context.historical ? `<div><b>${esc(T().ctxOccasion)}</b>${esc(s.context.historical)}</div>` : ""}
      </div></section>`;
  }

  if(s.key_terms?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secTerms)}</span>
      <span class="sec-note">${esc(T().termsNote)}</span></div>`;
    h += originalLine(s.key_terms.map(x => x.strongs));
    h += `<div class="terms">`;
    h += s.key_terms.map(t => `<div class="term" data-s="${esc(t.strongs || "")}">
        <div class="term-top">
          ${t.original ? `<span class="term-orig">${esc(t.original)}</span>` : ""}
          ${t.translit ? `<span class="term-tr">${esc(t.translit)}</span>` : ""}
          <span class="term-sur">“${esc(t.surface)}”</span>${sig(t.strongs)}
        </div>
        <p class="term-why">${esc(t.why_it_matters)}</p>
      </div>`).join("");
    h += `</div></section>`;
  }

  if(s.settled?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secSettled)}</span>
      <span class="sec-note">${esc(T().settledNote)}</span></div>`;
    h += s.settled.map(c => `<div class="claim">
        <span class="cert" data-c="${esc(c.certainty)}"><i></i><small>${T().cert[c.certainty]||""}</small></span>
        <span class="claim-body">${esc(c.claim)}${sigs(c.cites)}</span>
      </div>`).join("");
    h += `</section>`;
  }

  if(s.disputed?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secDisputed)}</span>
      <span class="sec-note">${esc(T().disputedNote)}</span></div>`;
    h += s.disputed.map(d2 => `<div class="dispute">
        <p class="dispute-q">${esc(d2.question)}</p>
        ${d2.why_it_is_hard ? `<p class="dispute-why">${esc(d2.why_it_is_hard)}</p>` : ""}
        <div class="positions">${d2.positions.map(p => `<div class="pos">
            <div class="pos-held">${esc(p.held_by)}</div>
            <p class="pos-view">${esc(p.view)}</p>
            <p class="pos-reason">${esc(p.reasoning)}${sigs(p.cites)}</p>
            ${p.key_texts?.length ? `<div class="pos-texts">${p.key_texts.map(esc).join(" · ")}</div>` : ""}
          </div>`).join("")}</div>
        <div class="dispute-foot">${esc(T().disputeFoot)}</div>
      </div>`).join("");
    h += `</section>`;
  }

  if(s.common_misreadings?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secMisread)}</span></div>`;
    h += s.common_misreadings.map(m => `<div class="misread">
        <p class="misread-x">${esc(m.misreading)}</p>
        <p class="misread-fix">${esc(m.correction)}${sigs(m.cites)}</p>
      </div>`).join("");
    h += `</section>`;
  }

  if(s.connections?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secConn)}</span></div>`;
    h += s.connections.map(c => `<div class="conn">
        <span class="conn-ref">${esc(c.ref)}</span>
        <span>${esc(c.relation)}${sigs(c.cites)}</span></div>`).join("");
    h += `</section>`;
  }

  if(s.go_deeper?.length || s.insufficient_evidence?.length){
    h += `<section><div class="sec-head"><span class="sec-title">${esc(T().secDeeper)}</span></div>
      <div class="deeper">`;
    if(s.go_deeper?.length)
      h += `<ul>${s.go_deeper.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if(s.insufficient_evidence?.length)
      h += `<p>${esc(T().insufficient(s.insufficient_evidence.join("; ")))}</p>`;
    h += `</div></section>`;
  }

  // integrity meter
  const kept = ig.claims_checked - ig.claims_removed;
  const ticks = Array.from({length: Math.min(ig.claims_checked, 40)}, (_, i) =>
    `<i class="${i < kept * Math.min(ig.claims_checked,40)/Math.max(ig.claims_checked,1) ? "on" : "off"}"></i>`).join("");
  h += `<section class="integrity">
    <div class="sec-title">${esc(T().secGrounding)}</div>
    <div class="meter">${ticks || '<i class="on"></i>'}</div>
    <div class="integrity-line">
      ${esc(T().traced(kept, ig.claims_checked))}${ig.claims_removed ? esc(T().removedN(ig.claims_removed)) : ""}<br>
      ${esc(T().counts(ev.commentary.length, ev.words.length, ev.cross_refs.length))}${d.cached ? esc(T().cached) : ` · ${d.elapsed_ms}ms`}
    </div>`;
  if(ig.removed?.length){
    h += `<details><summary>${esc(T().seeRemoved(ig.removed.length))}</summary><ul>`;

}

// ── book / chapter picker ───────────────────────────────────────────
let BOOKS = [], pickerBook = null, pickerChapter = null, pickerStart = null;
let BOOKS_MISSING = null;   // {translation, fix} when the text isn't ingested

async function loadBooks(){
  try{
    const r = await fetch(`/api/books?lang=${LANG}`);
    const d = await r.json();
    BOOKS = d.books || [];
    BOOKS_MISSING = d.missing ? {translation: d.translation, fix: d.fix} : null;
  }catch{ BOOKS = []; BOOKS_MISSING = null; }
  renderPicker();
  if(BOOKS_MISSING) flagMissing();
}

// A language with no text loaded is a setup gap, not a failure. Make it
// obvious and say exactly what to run, rather than showing an empty menu.
function flagMissing(){
  const t = T();
  $("#status").textContent = t.missingTrans(BOOKS_MISSING.translation);
  $("#status").style.color = "var(--rubric)";
  $("#status").style.borderColor = "var(--rubric)";
  const intro = $("#intro");
  if(intro){
    intro.innerHTML =
      `<h2>${esc(t.missingTrans(BOOKS_MISSING.translation))}</h2>
       <p>${esc(t.missingHow("").trim())}</p>
       <pre class="cmd">${esc(BOOKS_MISSING.fix)}</pre>`;
  }
}

function renderPicker(){
  const t = T(), body = $("#picker-body"), filter = ($("#picker-filter").value || "").toLowerCase();

  // Step 3 — verses. Chapters can run long (Psalm 119 is 176 verses), so
  // picking a range has to be possible without typing it.
  if(pickerBook && pickerChapter){
    const b = BOOKS.find(x => x.osis === pickerBook);
    const ch = b && b.chapters.find(c => c.n === pickerChapter);
    if(!ch){ pickerChapter = null; return renderPicker(); }
    const go = ref => {
      $("#ref").value = ref; syncPickerLabel();
      pickerStart = null; closePicker(); run();
    };
    body.innerHTML =
      `<button class="panel-back" id="picker-back">${esc(t.backToChapters)}</button>
       <h4>${esc(t.versesIn(b.name, ch.n))}</h4>
       <button class="wholechap" id="whole-chap">${esc(t.wholeChapter)} · ${ch.verses}</button>
       <p class="pickhint">${esc(pickerStart ? t.pickEnd(pickerStart) : t.pickStart)}</p>
       <div class="chaplist verselist">${
         Array.from({length: ch.verses}, (_, i) => i + 1).map(v =>
           `<button data-v="${v}" class="${
             pickerStart && v >= pickerStart ? "inrange" : ""}${
             pickerStart === v ? " startv" : ""}">${v}</button>`).join("")}</div>`;
    $("#picker-back").addEventListener("click", () => {
      pickerChapter = null; pickerStart = null; renderPicker();
    });
    $("#whole-chap").addEventListener("click", () => go(`${b.name} ${ch.n}`));
    body.querySelectorAll(".verselist button").forEach(btn =>
      btn.addEventListener("click", () => {
        const v = +btn.dataset.v;
        if(pickerStart === null){ pickerStart = v; renderPicker(); }
        else if(v === pickerStart){ go(`${b.name} ${ch.n}:${v}`); }
        else {
          const [a, z] = v < pickerStart ? [v, pickerStart] : [pickerStart, v];
          go(`${b.name} ${ch.n}:${a}-${z}`);
        }
      }));
    return;
  }

  if(pickerBook){
    const b = BOOKS.find(x => x.osis === pickerBook);
    if(!b){ pickerBook = null; return renderPicker(); }
    body.innerHTML =
      `<button class="panel-back" id="picker-back">${esc(t.backToBooks)}</button>
       <h4>${esc(t.chaptersIn(b.name))}</h4>
       <div class="chaplist">${b.chapters.map(c =>
         `<button data-ch="${c.n}">${c.n}</button>`).join("")}</div>`;
    $("#picker-back").addEventListener("click", () => { pickerBook = null; renderPicker(); });
    body.querySelectorAll(".chaplist button").forEach(btn =>
      btn.addEventListener("click", () => {
        pickerChapter = +btn.dataset.ch; pickerStart = null; renderPicker();
      }));
    return;
  }

  if(BOOKS_MISSING){
    body.innerHTML =
      `<h4>${esc(T().missingTrans(BOOKS_MISSING.translation))}</h4>
       <pre class="cmd">${esc(BOOKS_MISSING.fix)}</pre>`;
    return;
  }

  const match = b => !filter || b.name.toLowerCase().includes(filter);
  const group = (test, heading) => {
    const list = BOOKS.filter(b => b.testament === test && match(b));
    if(!list.length) return "";
    return `<h4>${esc(heading)}</h4><div class="booklist">${list.map(b =>
      `<button data-osis="${esc(b.osis)}">${esc(b.name)}</button>`).join("")}</div>`;
  };
  body.innerHTML = group("ot", t.ot) + group("nt", t.nt);
  body.querySelectorAll(".booklist button").forEach(btn =>
    btn.addEventListener("click", () => { pickerBook = btn.dataset.osis; renderPicker(); }));
}

function openPicker(){
  $("#picker-panel").classList.add("open");
  $("#picker-filter").style.display = BOOKS_MISSING ? "none" : "";
  $("#picker-filter").value = "";
  pickerBook = null; pickerChapter = null; pickerStart = null;
  renderPicker(); $("#picker-filter").focus();
}
function closePicker(){ $("#picker-panel").classList.remove("open"); }

async function runTopic(){
  const topic = $("#topic").value.trim();
  if(!topic) return;
  $("#go-topic").disabled = true;
  $("#passage").innerHTML = "";
  try{
    const d = await runStreaming("/api/topic/stream", {topic, lang:LANG, lens:LENS});
    if(!d) return;
    indexEvidence(d.evidence);
    renderTopic(d);
    decorate();
    wireTermHighlight();
    applyLensToDisputes();
    rememberView({kind:"topic", ref:d.topic, q:null, cache_key:null});
  }catch(e){
    $("#apparatus").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }finally{
    $("#go-topic").disabled = false;
    progressStop();
  }
}

// ── section nav + grounding badge ───────────────────────────────────
// Built after render by reading the DOM, so both renderers get it for free
// and neither has to know it exists.
function decorate(){
  const box = $("#apparatus");
  const sections = [...box.querySelectorAll(":scope > section")];
  if(sections.length < 3) return;

  sections.forEach((s, i) => {
    if(!s.id) s.id = "sec-" + i;
  });

  const links = sections
    .filter(s => !s.classList.contains("integrity"))
    .map(s => {
      const t = s.querySelector(".sec-title");
      return t ? `<a href="#${s.id}">${esc(t.textContent)}</a>` : "";
    }).join("");

  // Grounding is the distinctive thing this tool does. Burying it at the
  // bottom in 10px mono was hiding the point; it goes up top.
  const integ = box.querySelector(".integrity .integrity-line");
  let badge = "";
  if(integ){
    const m = integ.textContent.match(/(\d+)\D+(\d+)/);
    if(m){
      const kept = +m[1], total = +m[2], pct = total ? Math.round(kept/total*100) : 100;
      const removed = total - kept;
      badge = `<div class="groundbadge${removed ? " warn" : ""}">
        <span class="gb-n">${pct}%</span>
        <span class="gb-t"><b>${kept} of ${total} claims</b> traced to a retrieved source${
          removed ? `<br>${removed} removed as uncited` : ""}</span></div>`;
    }
  }

  const head = document.createElement("div");
  head.innerHTML = flagBar() + badge + `<nav class="secnav">${links}</nav>`;
  box.prepend(head);
  wireToolbar();
}

    navigator.clipboard.writeText(sermonMarkdown(d));
    $("#copy-md").textContent = T().copied;
    setTimeout(() => $("#copy-md").textContent = T().copyMd, 1600);
  });
  $("#dl-md").addEventListener("click", () => {
    const blob = new Blob([sermonMarkdown(d)], {type:"text/markdown"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = d.ref.replace(/[^\w]+/g, "-").toLowerCase() + ".md";
    a.click(); URL.revokeObjectURL(a.href);
  });
}

// Preachers work in Word, Docs, or on paper. Markdown pastes cleanly into all
// three and keeps the structure, so the workbench can leave the browser.
function sermonMarkdown(d){
  const s = d.study, t = T();
  const L = [`# ${d.ref}`, ""];
  if(d.opts?.audience) L.push(`*${d.opts.audience} · ${d.opts.minutes} min*`, "");
  if(s.big_idea) L.push(`## ${t.secBigIdea}`, "", s.big_idea, "");
  if(s.the_shape) L.push(`**${t.secShape}:** ${s.the_shape}`, "");
  (s.movements || []).forEach((m, i) => {
    L.push(`## ${i + 1}. ${m.title}  — ${m.verses}${m.minutes ? `  (${m.minutes} min)` : ""}`, "");
    if(m.read_aloud) L.push(`> **${t.readAloud}:** ${m.read_aloud}`, "");
    L.push(m.the_point, "");
    if(m.delivery) L.push(`*${t.delivery}: ${m.delivery}*`, "");
    (m.supporting_detail || []).forEach(x => L.push(`- ${x}`));
    if(m.supporting_detail?.length) L.push("");
    if(m.illustration_prompts?.length){
      L.push(`*${t.illusPrompts}:*`);
      m.illustration_prompts.forEach(x => L.push(`- ${x}`));
      L.push("");
    }
    if(m.transition_cue) L.push(`**${t.transitionCue}:** "${m.transition_cue}"`, "");
  });
  if(s.decisions_to_make?.length){
    L.push(`## ${t.secDecisions}`, "");
    s.decisions_to_make.forEach(dc => {
      L.push(`**${dc.question}**`, "", `${dc.why_it_matters}`, "");
      dc.options.forEach(o =>
        L.push(`- **${o.held_by}** — ${o.view}`, `  - ${t.ifYouTake}: ${o.if_you_take_this}`));
      L.push("");
    });
  }
  if(s.do_not_preach?.length){
    L.push(`## ${t.secDontPreach}`, "");
    s.do_not_preach.forEach(x => L.push(`- ~~${x.claim}~~ — ${x.why_not}`));
    L.push("");
  }
  if(s.application_prompts?.length){
    L.push(`## ${t.secApply}`, "");
    s.application_prompts.forEach(x => L.push(`- ${x}`));
    L.push("");
  }
  if(s.where_they_lose_you?.length){
    L.push(`## ${t.secDrift}`, "");
    s.where_they_lose_you.forEach(w =>
      L.push(`- **${w.moment}** — ${w.why}`, `  - ${w.what_helps}`));
    L.push("");
  }
  if(s.ways_in?.length){
    L.push(`## ${t.secWaysIn}`, "");
    s.ways_in.forEach(x => L.push(`- ${x}`)); L.push("");
  }
  if(s.cut_first?.length){
    L.push(`## ${t.secCut}`, "");
    s.cut_first.forEach((x, i) => L.push(`${i + 1}. ${x}`)); L.push("");
  }
  if(s.check_with_someone?.length){
    L.push(`## ${t.secCheck}`, "");
    s.check_with_someone.forEach(x => L.push(`- ${x}`)); L.push("");
  }
  L.push("---", "", "*Study aid, not a teacher. The decisions above are yours to make.*");
  return L.join("\n");
}

async function runSermon(){
  const ref = $("#s-ref").value.trim();
  if(!ref) return;
  $("#go-sermon").disabled = true;
  $("#passage").innerHTML = "";
  try{
    const d = await runStreaming("/api/sermon/stream",
      {ref, lang:LANG, lens:LENS, minutes:$("#s-min").value,
       audience:$("#s-aud").value.trim()});
    if(!d) return;
    indexEvidence(d.evidence);
    renderSermon(d);
    decorate();
    rememberView({kind:"sermon", ref:d.ref, q:null, cache_key:null});
    mountNotes(d.ref);
  }catch(e){
    $("#apparatus").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }finally{
    $("#go-sermon").disabled = false;
    progressStop();
  }
}

async function loadHistory(){
  const t = T(), body = $("#hist-body");
  $("#hist-all").setAttribute("aria-pressed", !HIST_SAVED_ONLY);
  $("#hist-saved").setAttribute("aria-pressed", HIST_SAVED_ONLY);
  body.innerHTML = `<p class="hist-empty">…</p>`;
  try{
    const r = await fetch(`/api/history?limit=80${HIST_SAVED_ONLY ? "&saved=1" : ""}`
      + (HIST_Q ? `&q=${encodeURIComponent(HIST_Q)}` : ""));
    const items = (await r.json()).items || [];
    if(!items.length){
      body.innerHTML = `<p class="hist-empty">${esc(
        HIST_Q ? t.noHistMatch : (HIST_SAVED_ONLY ? t.histEmptySaved : t.histEmpty))}</p>`;
      return;
    }
    const kindLabel = k => ({study:t.kindStudy, topic:t.kindTopic, sermon:t.kindSermon}[k] || k);
    body.innerHTML = items.map(it => `<div class="hist" data-k="${esc(it.cache_key)}">
        <button class="hist-open">
          <span class="hist-kind" data-k="${esc(it.kind)}">${esc(kindLabel(it.kind))}</span>
          <span class="hist-title">${esc(it.title || "—")}</span>
          ${it.detail ? `<span class="hist-detail">${esc(it.detail)}</span>` : ""}
          <span class="hist-when">${esc(when(it.created_at))}${
            it.lang !== "en" ? " · " + esc(it.lang.toUpperCase()) : ""}</span>
        </button>
        <button class="hist-star${+it.saved ? " on" : ""}" title="Save">${+it.saved ? "★" : "☆"}</button>
        <button class="hist-del" title="Remove">✕</button>
      </div>`).join("");

    body.querySelectorAll(".hist").forEach(row => {
      const key = row.dataset.k;
      row.querySelector(".hist-open").addEventListener("click", () => openEntry(key));
      row.querySelector(".hist-star").addEventListener("click", async e => {
        e.stopPropagation();
        const on = e.currentTarget.classList.toggle("on");
        e.currentTarget.textContent = on ? "★" : "☆";
        await fetch(`/api/history/${key}/save`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({saved:on})});
      });
      row.querySelector(".hist-del").addEventListener("click", async e => {
        e.stopPropagation();
        if(!confirm(T().confirmDelete)) return;
        await fetch(`/api/history/${key}`, {method:"DELETE"});
        loadHistory();
      });
    });
  }catch{
    body.innerHTML = `<p class="hist-empty">—</p>`;
  }
}

function when(ts){
  if(!ts) return "";
  const d = new Date(String(ts).replace(" ", "T") + (String(ts).endsWith("Z") ? "" : "Z"));
  if(isNaN(d)) return String(ts).slice(0, 16);
  const mins = Math.round((Date.now() - d) / 60000);
  if(mins < 1) return "now";
  if(mins < 60) return mins + "m";
  if(mins < 1440) return Math.round(mins / 60) + "h";
  if(mins < 10080) return Math.round(mins / 1440) + "d";
  return d.toLocaleDateString();
}

// Reopening restores the exact stored payload, so a study is never re-run and
// never re-billed just to look at it again.
async function openEntry(key){
  cancelRun(true);
  closeDrawer();
  $("#apparatus").innerHTML = `<p class="msg working">…</p>`;
  try{
    const r = await fetch(`/api/history/${key}`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.error);
    indexEvidence(d.evidence);
    if(d.kind === "sermon"){
      setMode("sermon"); $("#s-ref").value = d.ref || "";
      renderSermon(d);
    } else if(d.topic !== undefined && d.study?.question !== undefined){
      setMode("topic"); $("#topic").value = d.topic || "";
      renderTopic(d);
    } else {
      setMode("passage");
      $("#ref").value = d.ref || ""; $("#q").value = d.question || "";
      renderPassage(d.ref, d.evidence.passage);
      renderStudy(d);
    }
    decorate();
    wireTermHighlight();
    applyLensToDisputes();
  }catch(e){
    $("#apparatus").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }
}

// ── listen ──────────────────────────────────────────────────────────
// Browser speech synthesis: free, offline, no API cost. Built for the drive to
// a job site — set it playing before you pull out, not while moving.
let SPEAKING = false;

// Build what the voice should actually say.
//
// Reading the rendered text verbatim meant announcing every citation tag —
// "B S B colon Rom dot five dot one" — plus section headers and grounding
// counts. Those are visual scaffolding; a listener wants the passage and the
// prose, and nothing else.
function speechText(){
  const parts = [];
  const clean = el => {
    const copy = el.cloneNode(true);
    // Citation chips, position markers, word numbers, section labels and the
    // toolbar all exist to be looked at, not heard.
    copy.querySelectorAll(".sig, .ow-n, .term-at, .kp-w, .hubtag, .toolbar, " +
                          ".secnav, .groundbadge, .integrity, .prog-stop, " +
                          ".exportbar, .vnum, .passage-trans, .iltoggle, " +
                          ".origline, .pos-texts, .sec-note, .sec-head, " +
                          ".cert, .prog-foot, .livehint")
        .forEach(n => n.remove());
    // Verses are separate paragraphs on screen; without an explicit break the
    // reader runs "Jesus Christ,through whom" together as one breath.
    copy.querySelectorAll("p, div, li").forEach(n => {
      if(n.textContent.trim()) n.insertAdjacentText("beforeend", " ");
    });
    return copy.innerText
      // "Romans 5:1-5" should be spoken, not spelled with punctuation.
      .replace(/(\d+):(\d+)/g, "$1 verse $2")
      .replace(/\s*[·—–]\s*/g, ". ")
      .replace(/\bBSB\b/g, "")
      .replace(/\s{2,}/g, " ")
      .replace(/\n{2,}/g, "\n")
      .trim();
  };

  const p = $("#passage");
  if(p) parts.push(clean(p));

  const a = $("#apparatus");
  if(a){
    a.querySelectorAll(":scope > section").forEach(s => {
      if(s.classList.contains("integrity") || s.classList.contains("notes")) return;
      const title = s.querySelector(".sec-title");
      const body = clean(s);
      if(!body) return;
      // Say the heading as a sentence so sections do not run together.
      parts.push(title ? `${title.textContent.trim()}. ${body}` : body);
    });
  }
  return parts.join("\n\n").slice(0, 30000);
}

// Pick the best voice the device actually has.
//
// The default is usually the oldest formant synthesiser installed. Modern
// phones and laptops ship neural voices — Siri on iOS, Microsoft Natural on
// Windows, Google on Android — and they are free and already there. Choosing
// one deliberately is the difference between a robot and something listenable,
// at no cost.
const GOOD_VOICES = [
  /natural/i, /neural/i, /siri/i, /premium/i, /enhanced/i,
  /google (uk|us)/i, /samantha/i, /aaron/i, /daniel/i,
];

function pickVoice(lang){
  const want = lang === "es" ? "es" : "en";
  const all = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(want));
  if(!all.length) return null;
  for(const pattern of GOOD_VOICES){
    const hit = all.find(v => pattern.test(v.name));
    if(hit) return hit;
  }
  // Local voices beat remote ones: no network, no cutting out mid-sentence.
  return all.find(v => v.localService) || all[0];
}

function toggleSpeech(){
  const t = T();
  if(!("speechSynthesis" in window)) return;
  const btn = $("#btn-listen");
  if(SPEAKING){
    speechSynthesis.cancel(); SPEAKING = false;
    if(btn) btn.textContent = t.listenIt;
    return;
  }
  const text = speechText();
  if(!text) return;

  // Long text gets cut off by most engines, and a single utterance cannot be
  // paused cleanly. Splitting on sentence boundaries also gives the voice
  // somewhere natural to breathe.
  const chunks = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
  const batched = [];
  let acc = "";
  for(const c of chunks){
    if((acc + c).length > 220){ batched.push(acc); acc = c; }
    else acc += c;
  }
  if(acc.trim()) batched.push(acc);

  const voice = pickVoice(LANG);
  let i = 0;
  const speakNext = () => {
    if(i >= batched.length || !SPEAKING){
      SPEAKING = false;
      const b = $("#btn-listen"); if(b) b.textContent = T().listenIt;
      return;
    }
    const u = new SpeechSynthesisUtterance(batched[i++]);
    if(voice) u.voice = voice;
    u.lang = voice ? voice.lang : (LANG === "es" ? "es-ES" : "en-US");
    u.rate = 0.95; u.pitch = 1.0;
    u.onend = speakNext;
    u.onerror = speakNext;
    speechSynthesis.speak(u);
  };
  speechSynthesis.cancel();
  SPEAKING = true;
  speakNext();
  if(btn) btn.textContent = t.stopIt;
}

// Voices load asynchronously on most browsers; without this the first press
// gets whatever default was available before the real list arrived.

  return `<p class="msg">${head ? `<b>${esc(head)}</b><br>` : ""}${esc(d.error)}</p>`;

async function handleApiError(r, d){
  if(r.status === 401 && d.auth){ showAuth("in"); return true; }
  if(r.status === 401 && d.gated){ showGate(); return true; }
