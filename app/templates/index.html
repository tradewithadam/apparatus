// ── progress ────────────────────────────────────────────────────────
// Reads the server's stage events. Every line shown corresponds to something
// that actually finished — the counts are the counts retrieved, not estimates.
// A ticking clock runs alongside so a long wait still looks alive.
let PROGRESS_TIMER = null, PROGRESS_T0 = 0;

// One study at a time. Without this, clicking a second passage while the first
// is still writing leaves two streams appending to the same element — sections
// interleave, the timer double-ticks, and whichever finishes last wins. The
// controller also lets the reader stop a study they no longer want, which ends
// the server generator on its next yield and stops the tokens with it.
let INFLIGHT = null;

function cancelRun(quiet){
  if(INFLIGHT){
    INFLIGHT.abort();
    INFLIGHT = null;
  }
  progressStop();
  LIVE = null;
  ["go", "go-topic", "go-sermon"].forEach(id => {
    const b = $("#" + id);
    if(b) b.disabled = false;
  });
  // Clear the panel either way. A quiet cancel used to leave the old progress
  // rows and a dead timer on screen while the new run started elsewhere, which
  // read as two things happening at once.
  const box = $("#apparatus");
  if(box && (box.querySelector(".progress") || box.querySelector("#live"))){
    box.innerHTML = quiet ? "" : `<p class="msg">${esc(T().stopped)}</p>`;
  }
}

function progressStart(){
  PROGRESS_T0 = Date.now();
  $("#apparatus").innerHTML = `<div class="progress" id="prog">
      <div class="prog-rows" id="prog-rows"></div>
      <div class="prog-foot"><span id="prog-time">0s</span>
        <span class="prog-note">${esc(T().stPatience)}</span>
        <button class="prog-stop" id="prog-stop">${esc(T().stopIt2)}</button></div>
    </div>`;
  $("#prog-stop")?.addEventListener("click", () => cancelRun());
  clearInterval(PROGRESS_TIMER);
  PROGRESS_TIMER = setInterval(() => {
    const el = $("#prog-time");
    if(el) el.textContent = T().stElapsed(Math.round((Date.now() - PROGRESS_T0) / 1000));
  }, 1000);
}

function progressStop(){ clearInterval(PROGRESS_TIMER); PROGRESS_TIMER = null; }

function progressStage(ev){
  const t = T(), rows = $("#prog-rows");
  if(!rows) return;
  // Mark whatever was in flight as complete; a step only "finishes" when the
  // next one starts, which is the truth of how the pipeline runs.
  rows.querySelectorAll(".prog-row.live").forEach(r => {
    r.classList.remove("live"); r.classList.add("done");
  });
  let text = "";
  if(ev.stage === "reading")  text = t.stReading(ev.ref) + (ev.verses > 1 ? ` · ${ev.verses}` : "");
  else if(ev.stage === "locating") text = t.stLocating(ev.topic);
  else if(ev.stage === "found"){
    text = `${t.stFound}: ${ev.line}`;
    if(ev.traditions?.length) text += ` · ${ev.traditions.join(", ")}`;
  }
  else if(ev.stage === "writing")  text = t.stWriting;
  else if(ev.stage === "checking") text = t.stChecking;
  else return;
  const div = document.createElement("div");
  div.className = "prog-row live";
  div.innerHTML = `<span class="prog-dot"></span><span>${esc(text)}</span>`;
  rows.appendChild(div);
}

// Streams newline-delimited SSE. Falls back to the plain endpoint if streaming
// is unavailable (some proxies buffer it into uselessness), so the feature can
// never be the reason a study fails.
async function runStreaming(url, body, onDone){
  cancelRun(true);              // whatever was running is now abandoned
  LIVE = null;
  const ctl = new AbortController();
  INFLIGHT = ctl;
  progressStart();
  let res;
  try{
    res = await fetch(url, {method:"POST", signal: ctl.signal,
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  }catch(e){
    progressStop();
    if(e.name === "AbortError") return null;
    throw e;
  }

  if(!res.ok || !res.body || !(res.headers.get("content-type") || "").includes("event-stream")){
    progressStop();
    const d = await res.json().catch(() => ({error:"Request failed"}));
    if(await handleApiError(res, d)) return null;
    throw new Error(d.error || "Request failed");
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", payload = null, err = null;
  while(true){
    let done, value;
    try{
      ({done, value} = await reader.read());
    }catch(e){
      // Aborted mid-stream. Not an error to report — the reader asked for it.
      if(e.name === "AbortError" || ctl.signal.aborted) return null;
      throw e;
    }
    if(ctl.signal.aborted) return null;
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for(const p of parts){
      const line = p.split("\n").find(l => l.startsWith("data: "));
      if(!line) continue;
      let ev; try{ ev = JSON.parse(line.slice(6)); }catch{ continue; }
      if(ev.stage === "done") payload = ev.payload;
      else if(ev.stage === "error") err = ev.error;
      else if(ev.stage === "section"){ liveStart2(); liveSection(ev.key, ev.value); }
      else if(ev.stage === "item"){ liveStart2(); liveItem(ev.key, ev.value); }
      else progressStage(ev);
    }
  }
  progressStop();
  LIVE = null;
  if(INFLIGHT === ctl) INFLIGHT = null;
  if(err) throw new Error(err);
  // A stream that ends without `done` or `error` means the server stopped
  // talking mid-sentence. Saying so beats leaving the progress rows up
  // indefinitely, which reads as "still working" when nothing is.
  if(!payload && !ctl.signal.aborted) throw new Error(T().lostIt);
  return payload;
}


// ── the original-language line ──────────────────────────────────────
// A word study that lists δικαιωθέντες without showing where it sits leaves
// the reader unable to place it. This renders the actual Greek or Hebrew of
// the passage with the discussed terms highlighted, so the isolated cards
// below have a sentence to belong to.
function originalLine(strongsInPlay){
  if(!INTERLINEAR.length) return "";
  const t = T();
  const hebrew = INTERLINEAR[0].script === "hebrew";
  const wanted = new Set((strongsInPlay || []).filter(Boolean));
  const byVerse = {};
  INTERLINEAR.forEach(w => (byVerse[w.vid] = byVerse[w.vid] || []).push(w));

  return `<div class="origline">
    <div class="origline-head">
      <span>${esc(hebrew ? t.inTheHebrew : t.inTheGreek)}</span>
      ${wanted.size ? `<span class="origline-note">${esc(t.tapToTrace)}</span>` : ""}
    </div>
    ${Object.keys(byVerse).map(vid => {
      const ws = byVerse[vid];
      return `<p class="origline-verse${hebrew ? " rtl" : ""}">
        <span class="origline-ref">${esc(ws[0].ref.split(":").pop())}</span>
        ${ws.map((w, i) => {
          const hit = wanted.has(w.strongs);
          // Number every word. Highlighting alone cannot answer "which one is
          // it" when a Strong's number appears twice in a verse, and in Hebrew
          // the right-to-left flow makes counting by eye unreliable.
          return `<span class="ow${hit ? " lit" : ""}"
            title="${esc(w.ref)} word ${i + 1} — ${esc(w.translit ? w.translit + ": " : "")}${esc(w.gloss)}${
              w.morph ? " · " + esc(w.morph) : ""}"
            data-s="${esc(w.strongs)}" data-pos="${esc(w.ref)}#${i + 1}"
            ><span class="ow-n">${i + 1}</span>${esc(w.original)}</span>`;
        }).join(" ")}
      </p>`;
    }).join("")}
  </div>`;
}

// Hovering a term card lights the same word in the line above it.
function wireTermHighlight(){
  document.querySelectorAll(".term[data-s]").forEach(card => {
    const s = card.dataset.s;
    // Label the card with every position the word occupies, so the reader can
    // find it in the line above rather than hunting for a highlight.
    const spots = [...document.querySelectorAll(`.ow[data-s="${s}"]`)]
      .map(w => w.dataset.pos).filter(Boolean);
    if(spots.length && !card.querySelector(".term-at")){
      const at = document.createElement("div");
      at.className = "term-at";
      at.textContent = spots.map(x => x.replace("#", " · word ")).join("   ");
      card.appendChild(at);
    }
    const on = () => document.querySelectorAll(`.ow[data-s="${s}"]`)
      .forEach(w => w.classList.add("focus"));
    const off = () => document.querySelectorAll(`.ow[data-s="${s}"]`)
      .forEach(w => w.classList.remove("focus"));
    card.addEventListener("mouseenter", on);
    card.addEventListener("mouseleave", off);
    card.addEventListener("click", () => {
      const first = document.querySelector(`.ow[data-s="${s}"]`);
      if(first) first.scrollIntoView({block:"nearest", behavior:"smooth"});
      on(); setTimeout(off, 1600);
    });
  });
}


// ── the reader's own tradition ──────────────────────────────────────
// A lens, not a filter. It reorders and expands — the other positions are
// still rendered in full, one tap away. Filtering them out would quietly turn
// this into a tool that tells people their view is the only view, which is
// the thing it was built to prevent.
let LENS = localStorage.getItem("adfontes-lens") || "";

const TRADITION_LABELS = {
  "puritan":"Puritan", "reformed":"Reformed / Calvinist",
  "presbyterian":"Presbyterian", "methodist":"Methodist / Wesleyan",
  "lutheran":"Lutheran", "dispensational":"Dispensational",
  "catholic-patristic":"Catholic / Church Fathers",
  "restorationist":"Restoration Movement",
  "wesleyan-holiness":"Wesleyan-Holiness / Pentecostal roots",
  "brethren":"Plymouth Brethren", "baptist":"Baptist",
};
const tradLabel = t => TRADITION_LABELS[t] || (t || "").replace(/(^|[-\s])\w/g,
  c => c.toUpperCase()).replace(/-/g, " ");

function fillLens(traditions){
  const sel = $("#lens");
  if(!sel) return;
  sel.innerHTML = `<option value="">${esc(T().lensAny)}</option>` +
    (traditions || []).map(t =>
      `<option value="${esc(t)}"${t === LENS ? " selected" : ""}>${esc(tradLabel(t))}</option>`).join("");
  sel.title = T().lensNote;
}

function setLens(v){
  LENS = v || "";
  localStorage.setItem("adfontes-lens", LENS);
}

// Collapse the positions the reader didn't ask to lead with. Present, counted,
// one tap away — never removed.
function applyLensToDisputes(){
  if(!LENS) return;
  const label = tradLabel(LENS).toLowerCase();
  document.querySelectorAll(".dispute").forEach(d => {
    const cols = [...d.querySelectorAll(".pos")];
    if(cols.length < 2) return;
    const mine = cols.find(c => {
      const held = (c.querySelector(".pos-held")?.textContent || "").toLowerCase();
      return held.includes(LENS.split("-")[0]) || held.includes(label.split(" ")[0]);
    });
    if(!mine) return;
    const others = cols.filter(c => c !== mine);
    mine.classList.add("pos-lens");
    const grid = d.querySelector(".positions");
    grid.prepend(mine);
    others.forEach(o => o.classList.add("pos-folded"));
    const toggle = document.createElement("button");
    toggle.className = "pos-more";
    toggle.textContent = T().othersDiffer(others.length);
    toggle.addEventListener("click", () => {
      const open = others[0].classList.toggle("open");
      others.slice(1).forEach(o => o.classList.toggle("open", open));
      toggle.classList.toggle("open", open);
    });
    grid.after(toggle);
  });
}


// ── progressive rendering ───────────────────────────────────────────
// Sections appear as the model finishes them. Every item shown has already
// passed the citation check server-side — nothing is rendered and then
// retracted, because a claim that flashes on screen and disappears is worse
// than one that arrives a second later.
let LIVE = null;

// Swap the progress rows out for the document itself the first time real
// content arrives — the reader should be reading, not watching a checklist.
function liveStart2(){
  if(LIVE) return;
  // Do NOT stop the timer here. It used to be cleared and its last value
  // pasted in as static text, so the clock froze at whatever second the first
  // section arrived — reading as though the app had stalled at exactly the
  // moment it started working. Keep it running against the same start time.
  $("#apparatus").innerHTML =
    `<p class="livehint"><span id="live-status">${esc(T().stWriting)}</span>
       · <span id="prog-time">0s</span>
       <button class="prog-stop" id="prog-stop">${esc(T().stopIt2)}</button></p>`;
  $("#prog-stop")?.addEventListener("click", () => cancelRun());
  tickLive();
  liveStart();
}

function tickLive(){
  const paint = () => {
    const el = $("#prog-time");
    if(el) el.textContent = T().stElapsed(Math.round((Date.now() - PROGRESS_T0) / 1000));
  };
  paint();
  clearInterval(PROGRESS_TIMER);
  PROGRESS_TIMER = setInterval(paint, 1000);
}

function liveStart(){
  LIVE = {sections: {}};
  const box = $("#apparatus");
  const prog = document.createElement("div");
  prog.id = "live";
  box.appendChild(prog);
}

function liveSection(key, value){
  if(!LIVE) return;
  const t = T(), box = $("#live");
  if(!box) return;
  if(key === "scope_note"){
    box.insertAdjacentHTML("beforeend",
      `<section id="live-scope"><div class="sec-head">
         <span class="sec-title">${esc(t.secScope)}</span></div>
         <p class="scope">${esc(value)}</p></section>`);
  } else if(key === "summary"){
    box.insertAdjacentHTML("beforeend",
      `<section id="live-summary"><div class="sec-head">
         <span class="sec-title">${esc(t.secSummary)}</span></div>
         <p class="summary-text">${esc(value)}</p></section>`);
  } else if(key === "context"){
    box.insertAdjacentHTML("beforeend",
      `<section id="live-context"><div class="sec-head">
        <span class="sec-title">${esc(t.secContext)}</span></div><div class="ctx">
        ${value.literary ? `<div><b>${esc(t.ctxBook)}</b>${esc(value.literary)}</div>` : ""}
        ${value.historical ? `<div><b>${esc(t.ctxOccasion)}</b>${esc(value.historical)}</div>` : ""}
      </div></section>`);
  }
}

const LIVE_TITLES = {
  settled: () => T().secSettled, key_terms: () => T().secTerms,
  disputed: () => T().secDisputed, connections: () => T().secConn,
  common_misreadings: () => T().secMisread,
  // topic study
  what_scripture_addresses: () => T().secAddresses,
  key_passages: () => T().secKeyPassages,
  commonly_cited_but_does_not_say_this: () => T().secMisuse,
  positions: () => T().secPositions,
};

function liveItem(key, item){
  if(!LIVE) return;
  const t = T(), box = $("#live");
  if(!box) return;
  let sec = document.getElementById("live-" + key);
  if(!sec){
    box.insertAdjacentHTML("beforeend",
      `<section id="live-${esc(key)}"><div class="sec-head">
        <span class="sec-title">${esc((LIVE_TITLES[key] || (() => key))())}</span></div>
        <div class="live-body"></div></section>`);
    sec = document.getElementById("live-" + key);
  }
  const body = sec.querySelector(".live-body");
  let html = "";
  if(key === "settled"){
    html = `<div class="claim">
      <span class="cert" data-c="${esc(item.certainty)}"><i></i>
        <small>${T().cert[item.certainty]||""}</small></span>
      <span class="claim-body">${esc(item.claim)}${sigs(item.cites)}</span></div>`;
  } else if(key === "key_terms"){
    // The original-language line belongs above the first term card. Built once
    // per section, then extended as later terms arrive — the streamed path
    // previously rendered bare cards with no sentence to place them in.
    if(!body.querySelector(".origline")){
      body.insertAdjacentHTML("afterbegin", originalLine([item.strongs]));
    } else {
      const w = body.querySelectorAll(`.ow[data-s="${item.strongs}"]`);
      w.forEach(x => x.classList.add("lit"));
    }
    html = `<div class="term" data-s="${esc(item.strongs||"")}"><div class="term-top">
      ${item.original ? `<span class="term-orig">${esc(item.original)}</span>` : ""}
      ${item.translit ? `<span class="term-tr">${esc(item.translit)}</span>` : ""}
      <span class="term-sur">“${esc(item.surface)}”</span>${sig(item.strongs)}</div>
      <p class="term-why">${esc(item.why_it_matters)}</p></div>`;
  } else if(key === "disputed"){
    html = `<div class="dispute"><p class="dispute-q">${esc(item.question)}</p>
      ${item.why_it_is_hard ? `<p class="dispute-why">${esc(item.why_it_is_hard)}</p>` : ""}
      <div class="positions">${item.positions.map(p => `<div class="pos">
        <div class="pos-held">${esc(p.held_by)}</div>
        <p class="pos-view">${esc(p.view)}</p>
        <p class="pos-reason">${esc(p.reasoning)}${sigs(p.cites)}</p></div>`).join("")}</div></div>`;
  } else if(key === "connections"){
    html = `<div class="conn"><span class="conn-ref">${esc(item.ref)}</span>
      <span>${esc(item.relation)}${sigs(item.cites)}</span></div>`;
  } else if(key === "common_misreadings"){
    html = `<div class="misread"><p class="misread-x">${esc(item.misreading)}</p>
      <p class="misread-fix">${esc(item.correction)}${sigs(item.cites)}</p></div>`;
  } else if(key === "what_scripture_addresses"){
    html = `<div class="claim">
      <span class="cert" data-c="${esc(item.certainty)}"><i></i>
        <small>${T().cert[item.certainty]||""}</small></span>
      <span class="claim-body">${esc(item.claim)}${sigs(item.cites)}</span></div>`;
  } else if(key === "key_passages"){
    html = `<div class="kp"><span class="kp-ref">${esc(item.ref)}</span>
      <span>${esc(item.what_it_says)}${sigs(item.cites)}
        <span class="kp-w" data-w="${esc(item.weight)}">${esc(t[item.weight]||item.weight)}</span>
      </span></div>`;
  } else if(key === "commonly_cited_but_does_not_say_this"){
    html = `<div class="misuse"><div class="misuse-ref">${esc(item.ref)}</div>
      <p class="misuse-pop">${esc(item.popular_use)}</p>
      <p class="misuse-real">${esc(item.what_it_actually_says)}${sigs(item.cites)}</p></div>`;
  } else if(key === "positions"){
    // Positions arrive one at a time, so each gets its own row rather than a
    // two-column grid that would reflow as the second one lands.
    html = `<div class="dispute" style="margin-bottom:10px"><div class="positions"
      style="grid-template-columns:minmax(0,1fr)"><div class="pos">
      <div class="pos-held">${esc(item.held_by)}</div>
      <p class="pos-view">${esc(item.view)}</p>
      <p class="pos-reason">${esc(item.reasoning)}${sigs(item.cites)}</p>
      ${item.key_texts?.length ? `<div class="pos-texts">${item.key_texts.map(esc).join(" · ")}</div>` : ""}
      </div></div></div>`;
  }
  body.insertAdjacentHTML("beforeend", html);
  if(key === "key_terms") wireTermHighlight();
}


// ── stale page detection ────────────────────────────────────────────
// A deploy changes the server but not the tab someone already has open.
// Old JavaScript against a new API produces confusing half-broken output
// rather than an error, so the page checks whether it is out of date and
// reloads itself once.
let BUILD = null;
async function checkBuild(){
  try{
    const b = (await (await fetch("/api/version", {cache:"no-store"})).json()).build;
    if(BUILD && b && b !== BUILD){
      location.reload();
      return;
    }
    BUILD = b;
  }catch{}
}
setInterval(checkBuild, 60000);
checkBuild();

// ── accounts ────────────────────────────────────────────────────────
let ME = null, AUTH_MODE = "in";

async function loadMe(){
  try{
    const d = await (await fetch("/api/auth/me")).json();
    ME = d.user; window.AUTH_CFG = d;
    const b = $("#acct-btn");
    if(b) b.textContent = ME ? (ME.name || ME.email)[0].toUpperCase() : "◔";
    if(!ME && d.accounts_required) showAuth();
  }catch{}
}

function showAuth(mode){
  AUTH_MODE = mode || AUTH_MODE;
  document.getElementById("authmodal")?.remove();
  const t = T(), signup = AUTH_MODE === "up";
  const needInvite = signup && window.AUTH_CFG?.invite_required;
  const m = document.createElement("div");
  m.id = "authmodal"; m.className = "flagmodal";
  m.innerHTML = `<div class="flagcard">
    <h3>${esc(signup ? t.signUp : t.signIn)}</h3>
    <p class="authwhy">${esc(t.authWhy)}</p>
    ${signup ? `<label>${esc(t.nameL)}</label><input id="au-name" type="text">` : ""}
    <label>${esc(t.emailL)}</label><input id="au-email" type="email" autocomplete="email">
    <label>${esc(t.passwordL)}</label>
    <input id="au-pass" type="password" autocomplete="${signup ? "new-password" : "current-password"}">
    ${needInvite ? `<label>${esc(t.inviteL)}</label><input id="au-invite" type="text">` : ""}
    <p id="au-err" class="auth-err"></p>
    <div class="flagrow">
      <button id="au-switch">${esc(signup ? t.haveAccount : t.needAccount)}</button>
      <button id="au-go" class="notesave">${esc(signup ? t.signUp : t.signIn)}</button>
    </div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => {
    if(e.target === m && !window.AUTH_CFG?.accounts_required) m.remove();
  });
  $("#au-switch").addEventListener("click", () => showAuth(signup ? "in" : "up"));
  const go = async () => {
    const body = {email: $("#au-email").value, password: $("#au-pass").value};
    if(signup){
      body.name = $("#au-name")?.value || "";
      body.invite = $("#au-invite")?.value || "";
    }
    const r = await fetch(`/api/auth/${signup ? "register" : "login"}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ $("#au-err").textContent = d.error || "Something went wrong."; return; }
    ME = d.user; m.remove(); loadMe(); loadHistory?.();
  };
  $("#au-go").addEventListener("click", go);
  ["au-email","au-pass"].forEach(id =>
    $("#"+id)?.addEventListener("keydown", e => { if(e.key === "Enter") go(); }));
  $("#au-email").focus();
}

  if(!ME) return showAuth("in");
  const t = T();

          <small>${esc(u.email)}</small></span>

    <p id="ac-temp" class="ac-temp"></p>

      <button id="ac-pw">${esc(t.changePw)}</button>

  document.body.appendChild(m);

  m.querySelectorAll(".ut-reset").forEach(btn =>
    btn.addEventListener("click", async () => {
      if(!confirm(T().resetConfirm(btn.dataset.email))) return;
      const r = await fetch(`/api/admin/reset/${btn.dataset.id}`, {method:"POST"});
      const d = await r.json();
      const box = $("#ac-temp");
      if(!r.ok){ box.textContent = d.error; box.classList.add("bad"); return; }
      // Shown once. There is no way to retrieve it later by design — if it is
      // lost, reset again.
      box.classList.remove("bad");
      box.innerHTML = `${esc(T().resetDone)}<code>${esc(d.temporary_password)}</code>`;
    }));
}

function showChangePassword(){
  const t = T();
  const m = document.createElement("div");
  m.className = "flagmodal";
  m.innerHTML = `<div class="flagcard">
    <h3>${esc(t.changePw)}</h3>
    <label>${esc(t.currentPw)}</label><input id="pw-cur" type="password">
    <label>${esc(t.newPw)}</label><input id="pw-new" type="password">
    <p id="pw-err" class="auth-err"></p>
    <div class="flagrow"><button id="pw-go" class="notesave">${esc(t.changePw)}</button></div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener("click", e => { if(e.target === m) m.remove(); });
  const go = async () => {
    const r = await fetch("/api/auth/password", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({current: $("#pw-cur").value, new: $("#pw-new").value})});
    const d = await r.json();
    if(!r.ok){ $("#pw-err").textContent = d.error; return; }
    m.remove(); ME = null; loadMe();
    const toast = document.createElement("div");
    toast.className = "toast"; toast.textContent = T().pwChanged;
    document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
    showAuth("in");
  };
  $("#pw-go").addEventListener("click", go);
  $("#pw-new").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  $("#pw-cur").focus();
}

async function run(){
  const ref = $("#ref").value.trim();
  const q   = $("#q").value.trim();
  if(!ref) return;

  $("#go").disabled = true;

  try{
    const pr = await fetch(`/api/passage?ref=${encodeURIComponent(ref)}&lang=${LANG}`);
    const pd = await pr.json();
    if(!pr.ok) throw new Error(pd.error);
    INTERLINEAR = pd.interlinear || [];
    renderPassage(pd.ref, pd.verses);

    const sd = await runStreaming("/api/study/stream",
      {ref, question:q, lang:LANG, lens:LENS});
    if(!sd) return;
    indexEvidence(sd.evidence);
    renderStudy(sd);
    decorate();
    wireTermHighlight();
    applyLensToDisputes();
    rememberView({kind:"study", ref:sd.ref, q:sd.question, cache_key:null});
    mountNotes(sd.ref);
  }catch(e){
    $("#apparatus").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }finally{
    $("#go").disabled = false;
    progressStop();
  }
}

$("#ref").addEventListener("input", syncPickerLabel);
$("#go").addEventListener("click", run);
["ref","q"].forEach(id =>
  $("#"+id).addEventListener("keydown", e => { if(e.key === "Enter") run(); }));
function loadStatus(){
  fetch("/api/status").then(r => r.json()).then(s => {
    // loadBooks() may have already flagged a missing translation; that warning
    // is more useful than a verse count, so don't overwrite it.
    if(BOOKS_MISSING) return;
    const n = s.traditions.length;
    if(s.verses){ $("#status").style.color = ""; $("#status").style.borderColor = ""; }
    fillLens(s.traditions || []);
    $("#status").textContent = T().corpus(
      (s.verses/1000).toFixed(0), s.chunks.toLocaleString(), n);
    if(n && n < 3){
      $("#status").style.color = "var(--rubric)";
      $("#status").title = T().fewTraditions;
    }
    // The footer states the scope of the panel in plain words. A user reading
    // "faithful Christians disagree" deserves to know which Christians the
    // installation can actually hear from.
    if(n && s.corpus_years && s.corpus_years[0]){
      const note = document.createElement("div");
      note.className = "scopenote";
      note.textContent = T().scopeNote(n, s.corpus_years[0], s.corpus_years[1]);
      const f = $("#footer-note");
      if(f && !f.querySelector(".scopenote")) f.appendChild(note);
    }
  }).catch(() => $("#status").textContent = T().corpusFail);
}
