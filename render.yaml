# Render Blueprint — New → Blueprint → pick your repo.
#
# SQLite on a persistent disk, not Postgres. With commentary, interlinear and
# verse vectors loaded the database runs past 400 MB, which is over Supabase's
# free tier — so that route starts at $25/month before the first user. A 5 GB
# Render disk is about $1.25/month and needs no migration.
# The service name and disk name are deliberately unchanged by the rename.
# Renaming a Render service changes its URL and can detach the persistent disk
# — which would mean re-downloading the 620 MB database. The name people see
# lives in the app, not here.
services:
  - type: web
    name: apparatus
    runtime: python
    plan: starter              # free works, but sleeps after 15 min idle
    region: ohio
    branch: main
    buildCommand: pip install -r requirements.txt
    # --threads matters more than --workers here. A sync worker handles one
    # request start to finish, and a streaming study holds one for 60-90
    # seconds. With 2 sync workers, two concurrent studies occupy both, the
    # health check cannot be answered at all, Render times out at 5 seconds
    # and kills a perfectly healthy instance. Threads let each worker serve
    # many connections, so a long stream never blocks a short request.
    startCommand: >-
      gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT
      --workers 2 --threads 8 --worker-class gthread
      --timeout 300 --graceful-timeout 30 --keep-alive 65
    healthCheckPath: /healthz    # cheap by design; /api/status counts millions of rows
    disk:
      name: apparatus-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DB_PATH
        value: /var/data/apparatus.db     # on the disk, survives deploys
      - key: DB_URL
        sync: false            # gzipped database; fetched once on first boot
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-4-6
      - key: TRANSLATIONS
        value: BSB,KJV
      - key: TRANSLATIONS_ES
        value: SpaRV
      - key: EMBED_BACKEND
        value: voyage          # keeps PyTorch out of the build
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_BASE_URL
        value: https://ai.mongodb.com/v1   # Atlas key. Remove if from voyageai.com
      # ── spending guards ──────────────────────────────────────────
      - key: MAX_COMMENTARY
        value: "12"            # evidence passages per study; the main cost dial
      - key: GLOBAL_DAILY_CAP
        value: "500"           # hard ceiling on model calls per day
      - key: RATE_PER_HOUR
        value: "20"
      - key: RATE_PER_DAY
        value: "60"
      # ── accounts ─────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true    # Render generates and stores a random one
      - key: ACCOUNTS_REQUIRED
        value: "1"             # everyone signs in; notes and history are theirs
      - key: INVITE_CODE
        sync: false            # required to register. blank = open signup
      - key: ADMIN_EMAIL
        sync: false            # this account sees the usage table
      - key: ACCESS_CODE
        sync: false            # legacy shared code; leave blank once accounts are on
